{% extends 'base.html' %}
{% block content %}
  <div class="page-header">
    <h1>User accounts</h1>
  </div>

  <p class="muted">Manage access levels for registered accounts. New registrations default to employee.</p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
          <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.role }}</td>
            <td>
              <form method="post" action="{{ url_for('update_user_role', user_id=user.id) }}" class="inline-form">
                <select name="role">
                  {% for role in user_roles %}
                    <option value="{{ role }}" {% if user.role == role %}selected{% endif %}>{{ role }}</option>
                  {% endfor %}
                </select>
                <button type="submit" class="primary small">Save role</button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
